<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyphen Prefix — [lang|=&quot;en&quot;]</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* |= matches en or en- followed by a subtag */
        p[lang|="en"] {
            background-color: #d6f4e5;
            border-left: 5px solid #198754;
            padding: 10px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Hyphen Prefix — [lang|=&quot;en&quot;] -->
    <h1>Hyphen Prefix — [lang|=&quot;en&quot;]</h1>
    

    <div class="demo">
        <p lang="en">English — matches</p>
        <p lang="en-US">American English — matches</p>
        <p lang="en-GB">British English — matches</p>
        <p lang="english">english — does not match</p>
        <p lang="fr">French — does not match</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
