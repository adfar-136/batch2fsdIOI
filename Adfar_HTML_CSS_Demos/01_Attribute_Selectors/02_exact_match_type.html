<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact Attribute Value — [type=&quot;password&quot;]</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* = matches the complete attribute value */
        input[type="password"] {
            background-color: #fff2c6;
            border: 3px solid #d99b00;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Exact Attribute Value — [type=&quot;password&quot;] -->
    <h1>Exact Attribute Value — [type=&quot;password&quot;]</h1>
    

    <div class="demo">
        <label>Username: <input type="text" value="student"></label>
        <label>Password: <input type="password" value="password"></label>
        <label>Email: <input type="email" value="student@example.com"></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
