<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Presence — [required]</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* [] checks if the attribute exists */
        input[required] {
            border: 3px solid #e5484d;
            background-color: #fff1f2;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Attribute Presence — [required] -->
    <h1>Attribute Presence — [required]</h1>
    <p>Only the input with the required attribute gets a red border.</p>

    <div class="demo">
        <label>Required name: <input type="text" required placeholder="Required"></label>
        <label>Optional city: <input type="text" placeholder="Optional"></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
