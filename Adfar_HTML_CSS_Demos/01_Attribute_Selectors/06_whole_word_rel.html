<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whole Word — [rel~=&quot;nofollow&quot;]</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* ~= matches one space-separated word */
        a[rel~="nofollow"] {
            color: #b45309;
            font-weight: bold;
            border: 2px dashed #b45309;
            padding: 4px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Whole Word — [rel~=&quot;nofollow&quot;] -->
    <h1>Whole Word — [rel~=&quot;nofollow&quot;]</h1>
    

    <div class="demo">
        <p><a href="#one" rel="nofollow sponsored">nofollow sponsored — matches</a></p>
        <p><a href="#two" rel="noopener">noopener — does not match</a></p>
        <p><a href="#three" rel="nofollowing">nofollowing — does not match</a></p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
