<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ends With — [href$=&quot;.pdf&quot;]</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* $= matches the end of the value */
        a[href$=".pdf"] {
            color: #b42318;
            font-weight: bold;
            background-color: #fff0ed;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Ends With — [href$=&quot;.pdf&quot;] -->
    <h1>Ends With — [href$=&quot;.pdf&quot;]</h1>
    <p>Files are sample links; they are not required to exist for CSS to work.</p>

    <div class="demo">
        <p><a href="lecture.pdf">lecture.pdf — matches</a></p>
        <p><a href="lecture.docx">lecture.docx — does not match</a></p>
        <p><a href="lecture.pdf?download=1">PDF with query string — does not match</a></p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
