<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:first-child — First Element Child</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* First child of its parent */
        li:first-child {
            background-color: #fde68a;
            font-weight: bold;
        }

        li {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :first-child — First Element Child -->
    <h1>:first-child — First Element Child</h1>
    

    <div class="demo">
    
        <ul>
            <h1>dg</h1>
            <li>1 — selected</li>
            <li>2 — normal</li>
            <li>3 — normal</li>
            <li>4 — normal</li>
        </ul>
         <ul>
            <li>1 — selected</li>
            <li>2 — normal</li>
            <li>3 — normal</li>
            <li>4 — normal</li>
        </ul>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
