<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-child(2n + 1) — Odd Positions</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* 2n + 1 generates 1, 3, 5, ... */
        li:nth-child(2n + 1) {
            background-color: #bbf7d0;
        }

        li {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-child(2n + 1) — Odd Positions -->
    <h1>:nth-child(2n + 1) — Odd Positions</h1>
    

    <div class="demo">
        <ol>
            <li>Position 1</li>
            <li>Position 2</li>
            <li>Position 3</li>
            <li>Position 4</li>
            <li>Position 5</li>
            <li>Position 6</li>
            <li>Position 7</li>
            <li>Position 8</li>
        </ol>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
