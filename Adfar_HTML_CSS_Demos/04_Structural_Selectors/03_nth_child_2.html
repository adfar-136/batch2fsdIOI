<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-child(2) — Second Child</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Select position 2 among all element children */
        li:nth-child(2) {
            background-color: #fecaca;
            font-weight: bold;
        }

        li {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-child(2) — Second Child -->
    <h1>:nth-child(2) — Second Child</h1>
    

    <div class="demo">
        <ol>
            <li>Position 1</li>
            
            <li>Position 2 — selected</li>
            <li>Position 3</li>
            <li>Position 4</li>
        </ol>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
