<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-of-type(2n) — Even Same-Tag Positions</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* 2n selects 2nd, 4th, 6th p elements */
        p:nth-of-type(2n) {
            background-color: #f5d0fe;
        }

        p {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-of-type(2n) — Even Same-Tag Positions -->
    <h1>:nth-of-type(2n) — Even Same-Tag Positions</h1>
    

    <div class="demo">
        <h3>Heading does not change p counting</h3>
        <p>Paragraph 1</p>
        <p>Paragraph 2 — selected</p>
        <div>Other element between paragraphs</div>
        <p>Paragraph 3</p>
        <p>Paragraph 4 — selected</p>
        <p>Paragraph 5</p>
        <p>Paragraph 6 — selected</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
