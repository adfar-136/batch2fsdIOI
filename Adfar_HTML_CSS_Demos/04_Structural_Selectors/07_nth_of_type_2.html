<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-of-type(2) — Second Element of Same Tag</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Counts only p siblings, not the heading */
        p:nth-of-type(2) {
            background-color: #bae6fd;
            font-weight: bold;
        }

        p {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-of-type(2) — Second Element of Same Tag -->
    <h1>:nth-of-type(2) — Second Element of Same Tag</h1>
    

    <div class="demo">
        <h3>Heading — not a paragraph</h3>
        <p>Paragraph 1</p>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <h1>dddfgfhghd</h1>
        <p>Paragraph 2 — selected</p>
        <p>Paragraph 3</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
