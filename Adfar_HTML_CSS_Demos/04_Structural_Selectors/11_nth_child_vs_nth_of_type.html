<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-child vs :nth-of-type — Comparison</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Second child must also be a paragraph */
        #child p:nth-child(2) {
            background-color: #fecaca;
        }

        /* Second paragraph, regardless of other tags */
        #type p:nth-of-type(2) {
            background-color: #bbf7d0;
        }

        .demo section {
            border: 1px solid #d8deea;
            padding: 10px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-child vs :nth-of-type — Comparison -->
    <h1>:nth-child vs :nth-of-type — Comparison</h1>
    

    <div class="demo">
        <section id="child">
            <h3>nth-child(2)</h3>
            <p>First paragraph = child 2 — selected</p>
            <p>Second paragraph = child 3</p>
        </section>
        <section id="type">
            <h3>nth-of-type(2)</h3>
            <p>First paragraph</p>
            <p>Second paragraph — selected</p>
        </section>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
