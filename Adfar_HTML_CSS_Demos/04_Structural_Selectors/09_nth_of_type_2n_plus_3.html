<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-of-type(2n + 3) — Start at Three, Step Two</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* 2n + 3 gives 3, 5, 7, ... */
        p:nth-of-type(2n + 3) {
            background-color: #bbf7d0;
            font-weight: bold;
        }

        p {
            padding: 6px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-of-type(2n + 3) — Start at Three, Step Two -->
    <h1>:nth-of-type(2n + 3) — Start at Three, Step Two</h1>
    

    <div class="demo">
        <p>Paragraph 1</p>
        <p>Paragraph 2</p>
        <p>Paragraph 3 — selected</p>
        <p>Paragraph 4</p>
        <p>Paragraph 5 — selected</p>
        <p>Paragraph 6</p>
        <p>Paragraph 7 — selected</p>
        <p>Paragraph 8</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
