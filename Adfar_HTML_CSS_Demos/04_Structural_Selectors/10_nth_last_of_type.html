<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:nth-last-of-type(2) — Second of Type From End</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Count p elements from the end */
        p:nth-last-of-type(2) {
            background-color: #fecaca;
            font-weight: bold;
        }

        p {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :nth-last-of-type(2) — Second of Type From End -->
    <h1>:nth-last-of-type(2) — Second of Type From End</h1>
    

    <div class="demo">
        <p>Paragraph 1</p>
        <p>Paragraph 2</p>
        <h3>Heading does not count as a paragraph</h3>
        <p>Paragraph 3 — selected</p>
        <p>Paragraph 4 — last paragraph</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
