<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:link — Unvisited Links</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :link selects links not yet visited */
        a:link {
            color: #ee8607;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Other states may override this color */
        a:visited {
            color: #f6da06;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :link — Unvisited Links -->
    <h1>:link — Unvisited Links</h1>
    <p>Link colors depend on your browser history.</p>

    <div class="demo">
        <p><a href="https://example.com/first-lesson">Visit a sample lesson link</a></p>
        <p><a href="https://example.com/another-lesson">Visit another sample link</a></p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
