<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:visited — Previously Visited Links</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :visited is restricted for privacy */
        a:link {
            color: #2563eb;
        }

        a:visited {
            color: #f40909;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :visited — Previously Visited Links -->
    <h1>:visited — Previously Visited Links</h1>
    <p>Only certain visual properties, such as color, can differ for visited links.</p>

    <div class="demo">
        <p><a href="https://example.com">Open this link, then return to the page</a></p>
        <p><a href="https://example.org">Compare another link</a></p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
