<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:target — URL Fragment Match</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :target matches the element named in the URL hash */
        section:target {
            background-color: #fff0b8;
            border: 3px solid #eab308;
        }

        section {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #ccd5e2;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :target — URL Fragment Match -->
    <h1>:target — URL Fragment Match</h1>
    <p>Click a link to change the URL fragment and highlighted section.</p>

    <div class="demo">
        <nav>
            <a href="#about">Show About</a> |
            <a href="#faq">Show FAQ</a> |
            <a href="#contact">Show Contact</a>
        </nav>
        <section id="about">About section</section>
        <section id="faq">FAQ section</section>
        <section id="contact">Contact section</section>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
