<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:active — Element Being Activated</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :active usually applies while the button is pressed */
        button:active {
            background-color: #dc2626;
            color: white;
            transform: scale(0.96);
        }

        button {
            padding: 14px 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :active — Element Being Activated -->
    <h1>:active — Element Being Activated</h1>
    

    <div class="demo">
        <button type="button">Press and hold</button>
        <p>Hold the mouse button down to observe the active state.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
