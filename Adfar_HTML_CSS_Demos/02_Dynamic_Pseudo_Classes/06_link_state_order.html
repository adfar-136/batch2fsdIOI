<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link State Order — LVHA</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Link → Visited → Hover → Active */
        a:link {
            color: #2563eb;
        }

        a:visited {
            color: #7e22ce;
        }

        a:hover {
            color: #0f766e;
        }

        a:active {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Link State Order — LVHA -->
    <h1>Link State Order — LVHA</h1>
    <p>The classic LVHA order helps equal-specificity rules behave as intended.</p>

    <div class="demo">
        <p><a href="https://example.com/lvha">Try hovering and pressing this link</a></p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
