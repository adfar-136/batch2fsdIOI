<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:hover — Pointer Over Element</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :hover applies while the pointer is over the button */
        button:hover {
            background-color: #176b46;
            color: white;
            transform: translateY(-2px);
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :hover — Pointer Over Element -->
    <h1>:hover — Pointer Over Element</h1>
    

    <div class="demo">
        <button type="button">Move your mouse here</button>
        <p>Move the pointer away to restore the default appearance.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
