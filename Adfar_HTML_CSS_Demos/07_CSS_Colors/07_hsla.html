<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hsla() — HSL With Alpha</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Alpha controls transparency */
        .demo {
            background-color: #fde68a;
        }

        .half {
            background-color: hsla(220, 100%, 50%, 0.5);
        }

        .full {
            background-color: hsla(220, 100%, 50%, 1);
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | hsla() — HSL With Alpha -->
    <h1>hsla() — HSL With Alpha</h1>
    

    <div class="demo">
        <p class="sample half">Alpha 0.5</p>
        <p class="sample full">Alpha 1</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
