<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Colors — #RRGGBB</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Two hexadecimal digits per color channel */
        .red {
            background-color: #ff0000;
            color: white;
        }

        .blue {
            background-color: #2563eb;
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | HEX Colors — #RRGGBB -->
    <h1>HEX Colors — #RRGGBB</h1>
    

    <div class="demo">
        <p class="sample red">#ff0000 = red</p>
        <p class="sample blue">#2563eb = blue shade</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
