<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rgb() — Red, Green, Blue</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Values range from 0 to 255 */
        .one {
            background-color: rgb(255, 0, 0);
            color: white;
        }

        .two {
            background-color: rgb(0, 160, 255);
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | rgb() — Red, Green, Blue -->
    <h1>rgb() — Red, Green, Blue</h1>
    

    <div class="demo">
        <p class="sample one">rgb(255, 0, 0)</p>
        <p class="sample two">rgb(0, 160, 255)</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
