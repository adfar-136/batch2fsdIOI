<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hsl() — Hue, Saturation, Lightness</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Hue in degrees; saturation and lightness in % */
        .one {
            background-color: hsl(120, 100%, 40%);
            color: white;
        }

        .two {
            background-color: hsl(240, 100%, 60%);
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | hsl() — Hue, Saturation, Lightness -->
    <h1>hsl() — Hue, Saturation, Lightness</h1>
    

    <div class="demo">
        <p class="sample one">hsl(120, 100%, 40%)</p>
        <p class="sample two">hsl(240, 100%, 60%)</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
