<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Named Colors</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Predefined CSS color names */
        .tomato {
            background-color: tomato;
        }

        .lightblue {
            background-color: lightblue;
        }

        .rebeccapurple {
            background-color: rebeccapurple;
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | CSS Named Colors -->
    <h1>CSS Named Colors</h1>
    

    <div class="demo">
        <p class="sample tomato">tomato</p>
        <p class="sample lightblue">lightblue</p>
        <p class="sample rebeccapurple">rebeccapurple</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
