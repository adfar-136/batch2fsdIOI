<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Color — HEX, RGB, HSL</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* All three values describe the same red */
        .hex {
            background-color: #ff0000;
            color: white;
        }

        .rgb {
            background-color: rgb(255, 0, 0);
            color: white;
        }

        .hsl {
            background-color: hsl(0, 100%, 50%);
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Same Color — HEX, RGB, HSL -->
    <h1>Same Color — HEX, RGB, HSL</h1>
    

    <div class="demo">
        <p class="sample hex">HEX: #ff0000</p>
        <p class="sample rgb">RGB: rgb(255, 0, 0)</p>
        <p class="sample hsl">HSL: hsl(0, 100%, 50%)</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
