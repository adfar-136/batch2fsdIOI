<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rgba() — Transparent RGB Color</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Fourth value is alpha: 0 invisible, 1 opaque */
        .demo {
            background-color: #cbd5e1;
        }

        .half {
            background-color: rgba(255, 0, 0, 0.5);
        }

        .full {
            background-color: rgba(255, 0, 0, 1);
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | rgba() — Transparent RGB Color -->
    <h1>rgba() — Transparent RGB Color</h1>
    

    <div class="demo">
        <p class="sample half">50% opaque red</p>
        <p class="sample full">100% opaque red</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
