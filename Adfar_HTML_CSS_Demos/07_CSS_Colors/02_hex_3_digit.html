<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Colors — #RGB</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Each digit is doubled: #f80 = #ff8800 */
        .orange {
            background-color: #f80;
        }

        .green {
            background-color: #0a5;
            color: white;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | HEX Colors — #RGB -->
    <h1>HEX Colors — #RGB</h1>
    

    <div class="demo">
        <p class="sample orange">#f80 = #ff8800</p>
        <p class="sample green">#0a5 = #00aa55</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
