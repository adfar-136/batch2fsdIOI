<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linear-gradient() — Degrees</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Degrees control the gradient direction */
        .sample {
            min-height: 100px;
            background: linear-gradient(45deg, #f97316, #ec4899);
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | linear-gradient() — Degrees -->
    <h1>linear-gradient() — Degrees</h1>
    

    <div class="demo">
        <div class="sample">45deg gradient</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
