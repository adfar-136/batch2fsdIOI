<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear vs Radial Gradient</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Linear moves along a straight axis */
        .linear {
            background: linear-gradient(to right, #fde047, #2563eb);
        }

        /* Radial expands from a center */
        .radial {
            background: radial-gradient(circle, #fde047, #2563eb);
        }

        .sample {
            min-height: 105px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Linear vs Radial Gradient -->
    <h1>Linear vs Radial Gradient</h1>
    

    <div class="demo">
        <div class="sample linear">Linear</div>
        <div class="sample radial">Radial</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
