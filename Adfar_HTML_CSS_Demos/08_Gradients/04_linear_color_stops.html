<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linear-gradient() — Color Stops</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Stops place colors along the gradient */
        .sample {
            min-height: 110px;
            color: white;
            background: linear-gradient(to right, red 0%, orange 30%, blue 100%);
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | linear-gradient() — Color Stops -->
    <h1>linear-gradient() — Color Stops</h1>
    

    <div class="demo">
        <div class="sample">Red 0% → Orange 30% → Blue 100%</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
