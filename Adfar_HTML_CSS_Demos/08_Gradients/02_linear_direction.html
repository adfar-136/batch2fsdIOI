<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linear-gradient() — Directions</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* to right changes the gradient axis */
        .right {
            background: linear-gradient(to right, #16a34a, #fde047);
        }

        .bottom {
            background: linear-gradient(to bottom, #16a34a, #fde047);
        }

        .sample {
            min-height: 70px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | linear-gradient() — Directions -->
    <h1>linear-gradient() — Directions</h1>
    

    <div class="demo">
        <div class="sample right">to right</div>
        <div class="sample bottom">to bottom</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
