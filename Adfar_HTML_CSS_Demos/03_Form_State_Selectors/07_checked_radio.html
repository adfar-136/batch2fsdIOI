<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:checked — Selected Radio Option</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :checked also selects the chosen radio input */
        input[type="radio"]:checked {
            accent-color: #7c3aed;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :checked — Selected Radio Option -->
    <h1>:checked — Selected Radio Option</h1>
    

    <div class="demo">
        <label><input type="radio" name="level" checked> Beginner</label>
        <label><input type="radio" name="level"> Intermediate</label>
        <label><input type="radio" name="level"> Advanced</label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
