<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:focus — Currently Focused Element</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :focus applies to the focused control */
        input:focus {
            outline: 3px solid #7c3aed;
            background-color: #f5edff;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :focus — Currently Focused Element -->
    <h1>:focus — Currently Focused Element</h1>
    <p>Click an input or navigate with Tab to see the focus effect.</p>

    <div class="demo">
        <label>Name: <input type="text" placeholder="Click or press Tab"></label>
        <label>Email: <input type="email" placeholder="Move focus here"></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
