<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:focus-visible — Keyboard Focus Indicator</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :focus-visible commonly appears with keyboard navigation */
        button:focus-visible {
            outline: 4px solid #ea580c;
            outline-offset: 4px;
        }

        button {
            padding: 14px 20px;
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :focus-visible — Keyboard Focus Indicator -->
    <h1>:focus-visible — Keyboard Focus Indicator</h1>
    

    <div class="demo">
        <button type="button">First button</button>
        <button type="button">Second button</button>
        <p>Press Tab to move keyboard focus between buttons.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
