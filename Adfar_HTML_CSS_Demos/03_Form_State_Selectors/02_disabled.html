<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:disabled — Disabled Form Controls</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :disabled matches disabled form controls */
        input:disabled {
            background-color: #e5e7eb;
            color: #6b7280;
            border: 2px dashed #6b7280;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :disabled — Disabled Form Controls -->
    <h1>:disabled — Disabled Form Controls</h1>
    <p>A disabled control cannot receive focus and is not submitted with the form.</p>

    <div class="demo">
        <label>Active field: <input type="text" value="Editable"></label>
        <label>Disabled field: <input type="text" disabled value="Unavailable"></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
