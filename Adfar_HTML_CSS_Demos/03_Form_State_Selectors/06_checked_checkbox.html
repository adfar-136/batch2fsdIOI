<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:checked — Checked Checkbox</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :checked selects a selected checkbox */
        input[type="checkbox"]:checked {
            accent-color: #16a34a;
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :checked — Checked Checkbox -->
    <h1>:checked — Checked Checkbox</h1>
    <p>Toggle the boxes to see which ones match :checked.</p>

    <div class="demo">
        <label><input type="checkbox"> Accept terms</label>
        <label><input type="checkbox" checked> Subscribe to updates</label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
