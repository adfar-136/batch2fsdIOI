<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:read-only — Noneditable Fields</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :read-only matches controls that cannot be edited */
        input:read-only {
            background-color: #e0f2fe;
            border: 2px solid #0284c7;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :read-only — Noneditable Fields -->
    <h1>:read-only — Noneditable Fields</h1>
    <p>Readonly text inputs can be focused and are still submitted with a form.</p>

    <div class="demo">
        <label>Editable name: <input type="text" value="Student"></label>
        <label>Readonly roll no.: <input type="text" value="PW-101" readonly></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
