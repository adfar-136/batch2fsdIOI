<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:enabled — Interactive Form Controls</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :enabled matches enabled form controls */
        input:enabled {
            border: 3px solid #16a34a;
            background-color: #effdf4;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :enabled — Interactive Form Controls -->
    <h1>:enabled — Interactive Form Controls</h1>
    

    <div class="demo">
        <label>Enabled: <input type="text" placeholder="You can type"></label>
        <label>Disabled: <input type="text" disabled value="Cannot type"></label>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
