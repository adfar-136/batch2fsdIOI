<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding vs Margin</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Padding: inner space; margin: outer space */
        .sample {
            display: inline-block;
            background-color: #dbeafe;
            padding: 25px;
            margin: 20px;
            border: 4px solid #1d4ed8;
        }

        .demo {
            background-color: #fef3c7;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Padding vs Margin -->
    <h1>Padding vs Margin</h1>
    

    <div class="demo">
        <div class="sample">Blue area = padding + content<br>Yellow area = outer spacing</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
