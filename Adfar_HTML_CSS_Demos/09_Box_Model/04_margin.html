<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model — Margin</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Margin separates elements outside the border */
        .first {
            margin-bottom: 50px;
            background-color: #bfdbfe;
        }

        .second {
            background-color: #fecaca;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Box Model — Margin -->
    <h1>Box Model — Margin</h1>
    

    <div class="demo">
        <div class="sample first">First box: margin-bottom 50px</div>
        <div class="sample second">Second box</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
