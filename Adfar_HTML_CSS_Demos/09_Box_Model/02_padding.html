<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model — Padding</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Padding adds space inside the border */
        .no-padding {
            padding: 0;
            background-color: #fef08a;
        }

        .with-padding {
            padding: 30px;
            background-color: #bbf7d0;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Box Model — Padding -->
    <h1>Box Model — Padding</h1>
    

    <div class="demo">
        <div class="sample no-padding">padding: 0</div>
        <div class="sample with-padding">padding: 30px</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
