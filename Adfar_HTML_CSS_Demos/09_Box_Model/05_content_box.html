<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing: content-box</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Width excludes padding and border */
        .sample {
            width: 260px;
            padding: 20px;
            border: 6px solid #2563eb;
            box-sizing: content-box;
            background-color: #dbeafe;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | box-sizing: content-box -->
    <h1>box-sizing: content-box</h1>
    

    <div class="demo">
        <div class="sample">Total outer width = 260 + 40 + 12 = 312px</div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
