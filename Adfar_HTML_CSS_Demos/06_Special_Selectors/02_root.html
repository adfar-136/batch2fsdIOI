<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:root — Document Root and CSS Variables</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :root is the html element */
        :root {
            --brand-color: #7c3aed;
            --soft-bg: #f3e8ff;
        }

        .sample {
            color: var(--brand-color);
            background-color: var(--soft-bg);
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :root — Document Root and CSS Variables -->
    <h1>:root — Document Root and CSS Variables</h1>
    

    <div class="demo">
        <p class="sample">This box uses variables defined on :root.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
