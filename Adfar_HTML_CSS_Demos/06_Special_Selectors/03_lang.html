<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:lang() — Content Language</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Language selector uses inherited language */
        :lang(fr) {
            color: #b91c1c;
            font-style: italic;
        }

        :lang(en) {
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | :lang() — Content Language -->
    <h1>:lang() — Content Language</h1>
    <p>Unlike [lang=&quot;fr&quot;], :lang(fr) also matches inherited content language.</p>

    <div class="demo">
        <p lang="en">Hello, how are you?</p>
        <p lang="fr">Bonjour, comment allez-vous ?</p>
        <div lang="fr"><span>Ce texte hérite de la langue française.</span></div>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
