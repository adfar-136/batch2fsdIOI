<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector — *</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* * selects every element inside .demo */
        .demo * {
            box-sizing: border-box;
            border-left: 4px solid #0d9488;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Universal Selector — * -->
    <h1>Universal Selector — *</h1>
    <p>The star matches all element types inside the demo container.</p>

    <div class="demo">
        <h2>Heading</h2>
        <p>Paragraph</p>
        <button type="button">Button</button>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
