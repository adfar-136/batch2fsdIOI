<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::placeholder — Input Hint Text</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Styles the hint, not typed text */
        input::placeholder {
            color: #7c3aed;
            font-style: italic;
        }

        input {
            padding: 12px;
            width: 280px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | ::placeholder — Input Hint Text -->
    <h1>::placeholder — Input Hint Text</h1>
    

    <div class="demo">
        <input type="text" placeholder="Enter your full name">
        <input type="email" placeholder="Enter your email">
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
