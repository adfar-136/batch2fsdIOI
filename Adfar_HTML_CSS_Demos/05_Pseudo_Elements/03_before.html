<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::before — Content Before an Element</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* ::before generates content before text */
        li::before {
            content: "✓ ";
            color: #16a34a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | ::before — Content Before an Element -->
    <h1>::before — Content Before an Element</h1>
    <p>The content property is required here to generate the visible check mark.</p>

    <div class="demo">
        <ul>
            <li>HTML basics</li>
            <li>CSS selectors</li>
            <li>Responsive design</li>
        </ul>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
