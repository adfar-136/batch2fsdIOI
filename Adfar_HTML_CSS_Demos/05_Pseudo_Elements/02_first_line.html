<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::first-line — Style Wrapped First Line</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* First line depends on available width */
        p::first-line {
            color: #1d4ed8;
            font-weight: bold;
            text-transform: uppercase;
        }

        p {
            max-width: 340px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | ::first-line — Style Wrapped First Line -->
    <h1>::first-line — Style Wrapped First Line</h1>
    

    <div class="demo">
        <p>CSS lets us style the first visible line of a paragraph. The line length changes when the container becomes wider or narrower, so resize the browser to observe the difference.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
