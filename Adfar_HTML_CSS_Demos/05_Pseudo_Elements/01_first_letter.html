<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::first-letter — Style First Letter</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* :: selects a pseudo-element */
        p::first-letter {
            color: #b91c1c;
            font-size: 38px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | ::first-letter — Style First Letter -->
    <h1>::first-letter — Style First Letter</h1>
    

    <div class="demo">
        <p>Kashmir has beautiful mountains and valleys.</p>
        <p>Students learn CSS through practical examples.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
