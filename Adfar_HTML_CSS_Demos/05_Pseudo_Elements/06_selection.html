<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::selection — Selected Text</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Styles text while the user selects it */
        p::selection {
            background-color: #fde047;
            color: #7f1d1d;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | ::selection — Selected Text -->
    <h1>::selection — Selected Text</h1>
    

    <div class="demo">
        <p>Select this sentence with your mouse to see the yellow selection highlight.</p>
        <p>Select only a few words to see the effect on part of the text.</p>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
