<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Class vs Pseudo-Element</title>

    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            line-height: 1.6;
            color: #172033;
        }

        .demo {
            max-width: 760px;
            padding: 20px;
            border: 1px solid #d8deea;
            border-radius: 12px;
        }

        .demo > * {
            margin-bottom: 14px;
        }

        .sample {
            padding: 12px;
            border: 1px solid #bbc5d8;
            border-radius: 6px;
        }

        /* Single colon: state */
        button:hover {
            background-color: #bfdbfe;
        }

        /* Double colon: generated part */
        button::before {
            content: "★ ";
            color: #d97706;
        }

        button {
            padding: 12px 18px;
        }
    </style>
</head>
<body>
    <!-- @adfarsirofficial | Pseudo-Class vs Pseudo-Element -->
    <h1>Pseudo-Class vs Pseudo-Element</h1>
    <p>The star is generated by ::before; the background changes with :hover.</p>

    <div class="demo">
        <button type="button">Hover over this button</button>
    </div>

    <p><small>Classroom demo by @adfarsirofficial</small></p>
</body>
</html>
