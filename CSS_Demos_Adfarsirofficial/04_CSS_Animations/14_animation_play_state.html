<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation-play-state</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .stage { position: relative; height: 160px; border: 2px dashed #aabbcc;
                 background: #f8faff; padding: 12px; overflow: hidden; }
        .ball { width: 60px; height: 60px; border-radius: 12px; background: royalblue; }
    /* Pause the motion while hovering. */
        .ball:hover { animation-play-state: paused; }
    /* Animation for this demonstration. */
        .ball { animation: move 2s infinite alternate; }
        @keyframes move { to { transform: translateX(180px); } }
  </style>
</head>
<body>
  <h1>animation-play-state</h1>
  <p>Hovering pauses the animation; moving the mouse away resumes it.</p>
  <div class="stage"><div class="ball"></div></div>
  <p class="hint">Hover over the blue square.</p>
</body>
</html>
