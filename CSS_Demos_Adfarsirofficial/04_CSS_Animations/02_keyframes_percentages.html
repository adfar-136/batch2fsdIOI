<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@keyframes: Percentage Steps</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .stage { position: relative; height: 160px; border: 2px dashed #aabbcc;
                 background: #f8faff; padding: 12px; overflow: hidden; }
        .ball { width: 60px; height: 60px; border-radius: 12px; background: royalblue; }

    /* Animation for this demonstration. */
        .ball { animation: path 3s infinite; }
        @keyframes path { 0% { transform: translate(0, 0); } 50% { transform: translate(140px, 60px); } 100% { transform: translate(0, 0); } }
  </style>
</head>
<body>
  <h1>@keyframes: Percentage Steps</h1>
  <p>Percentages let you control multiple moments in one animation.</p>
  <div class="stage"><div class="ball"></div></div>
  <p class="hint">Change the 50% point to 75%.</p>
</body>
</html>
