<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation-fill-mode: both</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .stage { position: relative; height: 160px; border: 2px dashed #aabbcc;
                 background: #f8faff; padding: 12px; overflow: hidden; }
        .ball { width: 60px; height: 60px; border-radius: 12px; background: royalblue; }

    /* Animation for this demonstration. */
        .ball { animation: move 2s 1 both; animation-delay: 1s; }
        @keyframes move { from { background: tomato; transform: translateX(30px); } to { background: royalblue; transform: translateX(180px); } }
  </style>
</head>
<body>
  <h1>animation-fill-mode: both</h1>
  <p>Both applies the starting keyframe during the delay and ending keyframe afterward.</p>
  <div class="stage"><div class="ball"></div></div>
  <p class="hint">Reload to see both phases.</p>
</body>
</html>
