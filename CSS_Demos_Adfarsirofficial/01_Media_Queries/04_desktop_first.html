<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop-First Design</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card { padding: 24px; background: #d5edff; }
        /* Reduce to one column on smaller screens. */
        @media (max-width: 700px) {
          .cards { grid-template-columns: 1fr; }
        }
  </style>
</head>
<body>
  <h1>Desktop-First Design</h1>
  <p>Three columns by default; one column at 700px or less.</p>
  <div class="cards"><div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div></div>
  <p class="hint">Compare this approach with mobile-first.</p>
</body>
</html>
