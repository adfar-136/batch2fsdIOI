<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@media (min-width)</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .card { background: lightskyblue; padding: 24px; width: 220px; }
        /* At 600px or wider, turn the card green. */
        @media (min-width: 600px) {
          .card { background: lightgreen; }
        }
  </style>
</head>
<body>
  <h1>@media (min-width)</h1>
  <p>At widths of 600px or more, the background changes.</p>
  <div class="card">Resize the browser window.</div>
  <p class="hint">Try 400px and 800px browser widths.</p>
</body>
</html>
