<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Transition Properties</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    /* Each property can use its own timing. */
        .demo { transition: transform 1.5s ease, background-color .3s linear; }
  </style>
</head>
<body>
  <h1>Multiple Transition Properties</h1>
  <p>Color changes quickly while position changes slowly.</p>
  <button class="demo">Hover me</button>
  <p class="hint">Observe the two different speeds.</p>
</body>
</html>
