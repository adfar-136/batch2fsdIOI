<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Card Transition</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    .demo { transition: transform .3s ease, box-shadow .3s ease; }
        .demo:hover { transform: translateY(-8px); box-shadow: 0 12px 24px #0003; background: royalblue; }
  </style>
</head>
<body>
  <h1>Hover Card Transition</h1>
  <p>A card can rise and gain a shadow without JavaScript.</p>
  <div class="demo">Hover over this card</div>
  <p class="hint">Try translateY(-3px).</p>
</body>
</html>
