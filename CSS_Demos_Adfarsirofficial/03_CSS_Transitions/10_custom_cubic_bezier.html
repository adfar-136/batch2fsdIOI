<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition-timing-function: cubic-bezier()</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    /* Four numbers define the timing curve. */
        .demo { transition: transform 2s cubic-bezier(.2, 1.5, .6, 1); }
  </style>
</head>
<body>
  <h1>transition-timing-function: cubic-bezier()</h1>
  <p>A custom curve can produce an overshoot-like movement.</p>
  <button class="demo">Hover me</button>
  <p class="hint">Try cubic-bezier(0, 0, 1, 1).</p>
</body>
</html>
