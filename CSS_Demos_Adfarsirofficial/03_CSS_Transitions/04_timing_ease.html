<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition-timing-function: ease</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    /* ease is the default: slow start and finish. */
        .demo { transition: transform 2s ease; }
  </style>
</head>
<body>
  <h1>transition-timing-function: ease</h1>
  <p>The motion starts and ends gently, with more speed in the middle.</p>
  <button class="demo">Hover me</button>
  <p class="hint">Compare with the linear demo.</p>
</body>
</html>
