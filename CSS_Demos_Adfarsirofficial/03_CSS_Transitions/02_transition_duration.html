<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition-duration</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    /* The hover change lasts two seconds. */
        .demo { transition-property: transform, background-color; transition-duration: 2s; }
  </style>
</head>
<body>
  <h1>transition-duration</h1>
  <p>Duration controls how long the change takes, not when it starts.</p>
  <button class="demo">Hover me</button>
  <p class="hint">Try .2s and 4s.</p>
</body>
</html>
