<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition-delay</title>
  <style>

    body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
    h1 { font-size: 24px; }
    .hint { color: #555; font-size: 14px; margin-top: 22px; }
    .demo { display: inline-block; background: royalblue; color: white; padding: 20px 28px;
                border: 0; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .demo:hover { background: tomato; transform: translateX(70px); }

    /* Wait one second before the transition begins. */
        .demo { transition: transform 1s, background-color 1s; transition-delay: 1s; }
  </style>
</head>
<body>
  <h1>transition-delay</h1>
  <p>Delay adds waiting time after the hover state is triggered.</p>
  <button class="demo">Hover me</button>
  <p class="hint">Try 0s and .5s.</p>
</body>
</html>
