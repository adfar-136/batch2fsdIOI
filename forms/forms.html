<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get" novalidate>
        <input type="text" value="adfar" name="username" minlength="3" maxlength="700"  placeholder="Enter Username"> <br> <br>
        <input type="email" name="email" placeholder="Enter Email" value="a@a.com" autofocus required> <br> <br>
        <input type="password" required placeholder="Enter Password"> <br><br>
        <input type="number" min="0" max="100" step="5" placeholder="Enter age"> <br><br>
        <input type="file"><br><br>
        <input type="date"><br><br>
        <input type="week"><br><br>
        <input type="color"><br><br>
        <input type="reset"><br><br>
        <input type="datetime-local"><br><br>
        <input type="url" placeholder="https://example.com"><br><br>
        <input type="range" min="0" max="100" value="75" step="10"><br><br>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
