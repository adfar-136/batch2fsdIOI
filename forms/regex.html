<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Regular Expression</h1>
    <form>
        <input type="text" pattern="a?r">
        <input type="text" pattern="a*r">
        <input type="text" pattern="a+r">
        <input type="text" pattern="a.r">
        <input type="text" pattern="a\.r">
        <input type="text" pattern="cat|dog">
        <input type="text" pattern="(cat)+">
        <input type="text" pattern=".(cat)+">
        <input type="text" pattern="Hello.*">
        <input type="text" pattern="[abcde]+">
        <input type="text" pattern="[0-9]+">
        <input type="text" pattern="\d">
        <input type="text" pattern="\d+">
        <input type="text" pattern="\D+">
        <input type="text" pattern="\w+">
        <input type="text" pattern="\W+">
        <input type="text" pattern="\s+">
        <input type="text" pattern="ad\S+">
        <input type="text" pattern="\d{4}">
        <input type="text" pattern="\w{4}">
        <input type="text" pattern="\d{4,7}">
        <input type="text" pattern="\w{4,7}">
        <input type="text" pattern="\d{4,}">

        <button type="submit">Submit</button>
    </form>
</body>
</html>
